---
# Build installable disk artifacts (qcow2 + Anaconda installer ISO) from a
# published Wraindrock image. This workflow is deliberately separate from
# build.yml: the OCI image is the source of truth, and disk artifacts are
# derived, expensive, and versioned by the image they were built from.
#
# Usage:
#   gh workflow run disk.yml -f image_ref=ghcr.io/wraindrock/wraindrock-linux:44
#
# Pin image_ref to a digest for reproducible artifacts; a moving tag is
# accepted for convenience and the resolved digest is recorded in the summary.
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Container image reference to build from (tag or digest)"
        default: "ghcr.io/wraindrock/wraindrock-linux:44"
        required: true
        type: string
      channel_ref:
        description: "Moving tag the installed system should track"
        default: "ghcr.io/wraindrock/wraindrock-linux:44"
        required: true
        type: string
      vm_test:
        description: "Boot the ISO under QEMU/KVM and wait for the installed system"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: disk
  cancel-in-progress: false

env:
  # Pinned by digest: the builder turns a bootc image into disk artifacts and
  # a floating tag would make "same commit, different ISO" possible.
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder@sha256:30e7eac70b6e4448da57aaff66d6a89dbd1526572e8b77be31da129e692eb3e9"

jobs:
  disk:
    name: Build qcow2 + installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman and xorriso
        run: |
          set -euo pipefail
          missing=()
          command -v podman >/dev/null || missing+=(podman)
          command -v xorriso >/dev/null || missing+=(xorriso)
          command -v mkfs.btrfs >/dev/null || missing+=(btrfs-progs)
          command -v qemu-img >/dev/null || missing+=(qemu-utils)
          command -v qemu-system-x86_64 >/dev/null || missing+=(qemu-system-x86)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          podman --version
          xorriso --version | head -1

      - name: Install pinned oras
        # oras is not packaged on the runner; pin the release and verify the
        # tarball so a compromised upstream tag cannot silently replace it.
        run: |
          set -euo pipefail
          version=1.3.4
          sha256=f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
          curl -fsSL -o /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/oras.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
          oras version

      - name: Mount podman storage on a loopback btrfs
        # The runner's root filesystem is too small for image build tree +
        # podman storage + qcow2 + ISO at once. /mnt has ~70 GB free.
        run: |
          set -euo pipefail
          img=/mnt/podman-storage.img
          if [ ! -d /mnt ]; then img=/var/tmp/podman-storage.img; fi
          sudo mkdir -p /var/lib/containers/storage
          sudo truncate -s 40G "$img"
          sudo mkfs.btrfs -f "$img"
          sudo podman system reset --force || true
          sudo systemctl stop podman.service podman.socket 2>/dev/null || true
          sudo mount -o compress=zstd:1 "$img" /var/lib/containers/storage
          sudo df -h /var/lib/containers/storage

      - name: Pull image and builder
        run: |
          set -euo pipefail
          for ref in "${{ inputs.image_ref }}" "${{ inputs.channel_ref }}"; do
            for attempt in 1 2 3; do
              sudo podman pull "${ref}" && break
              [ "$attempt" = 3 ] && { echo "::error::cannot pull ${ref}"; exit 1; }
              sleep $((attempt * 20))
            done
          done
          # Installed systems track the channel tag, so it must resolve to the
          # exact image we verified for this run (an immutable tag/digest).
          image_id=$(sudo podman image inspect --format '{{ .Id }}' "${{ inputs.image_ref }}")
          channel_id=$(sudo podman image inspect --format '{{ .Id }}' "${{ inputs.channel_ref }}")
          if [ "${image_id}" != "${channel_id}" ]; then
            echo "::error::channel tag and requested image differ; refusing to build"
            exit 1
          fi
          sudo podman pull "${BIB_IMAGE}"

      - name: Record image identity
        id: image
        run: |
          set -euo pipefail
          VERSION=$(sudo podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "${{ inputs.image_ref }}")
          REVISION=$(sudo podman image inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "${{ inputs.image_ref }}")
          DIGEST=$(sudo podman image inspect --format '{{ .Digest }}' "${{ inputs.image_ref }}")
          [ -n "${VERSION}" ] && [ -n "${REVISION}" ]
          {
            echo "version=${VERSION}"
            echo "revision=${REVISION}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${{ inputs.image_ref }}"
          echo "Version: ${VERSION}  Revision: ${REVISION}"
          echo "Digest: ${DIGEST}"

      - name: Build qcow2
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${PWD}/output:/output" \
            -v "${PWD}/disk_config/disk.toml:/config.toml:ro" \
            "${BIB_IMAGE}" \
            build --output /output --chown "$(id -u):$(id -g)" \
            --rootfs btrfs --use-librepo=True \
            --type qcow2 "${{ inputs.channel_ref }}"
          qcow2=$(find output -type f -name '*.qcow2' | head -1)
          [ -n "${qcow2}" ] || { echo "::error::no qcow2 produced"; exit 1; }

      - name: Build installer ISO
        run: |
          set -euo pipefail
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${PWD}/output:/output" \
            "${BIB_IMAGE}" \
            build --output /output --chown "$(id -u):$(id -g)" \
            --rootfs btrfs --use-librepo=True \
            --type anaconda-iso "${{ inputs.channel_ref }}"
          iso=$(find output -type f -name '*.iso' | head -1)
          [ -n "${iso}" ] || { echo "::error::no ISO produced"; exit 1; }
          # Fedora-style live media name, not BIB's generic install.iso.
          target="$(dirname "${iso}")/Wraindrock-Live.iso"
          if [ "${iso}" != "${target}" ]; then
            mv -f "${iso}" "${target}"
          fi
          echo "ISO: ${target}"

      - name: Add the interactive/unattended boot-menu choice
        # bootc-image-builder always injects a kickstart, which erases the first
        # disk without asking. Remaster the ISO so the default entry starts the
        # interactive installer (a partial kickstart only supplies the payload
        # location) and the unattended entry stays an explicit choice.
        run: |
          set -euo pipefail
          # The podman storage loopback is no longer needed once the ISO exists.
          sudo umount /var/lib/containers/storage 2>/dev/null || true
          sudo rm -f /mnt/podman-storage.img /var/tmp/podman-storage.img
          iso=$(find output/bootiso -name '*.iso' -print -quit)
          CHANNEL_REF="${{ inputs.channel_ref }}" bash tests/iso-menu.sh "${iso}"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          iso=$(find output -type f -name '*.iso' | head -1)
          qcow2=$(find output -type f -name '*.qcow2' | head -1)
          [ -n "${iso}" ] && [ -n "${qcow2}" ]

          # qcow2: QFI\xfb magic, and qemu-img can open it.
          magic=$(head -c 4 "${qcow2}" | od -An -tx1 | tr -d ' \n')
          [ "${magic}" = "514649fb" ] || { echo "::error::bad qcow2 magic: ${magic}"; exit 1; }
          qemu-img info "${qcow2}" || true

          # ISO: ISO9660 primary volume descriptor at 32769 ("CD001") and a
          # bootable MBR signature.
          iso_magic=$(dd if="${iso}" bs=1 skip=32769 count=5 status=none)
          [ "${iso_magic}" = "CD001" ] || { echo "::error::not an ISO9660 image"; exit 1; }
          mbr=$(dd if="${iso}" bs=1 skip=510 count=2 status=none | od -An -tx1 | tr -d ' \n')
          [ "${mbr}" = "55aa" ] || { echo "::error::ISO is not bootable (no 0x55aa MBR)"; exit 1; }

          # Mount and look for the pieces the installer needs.
          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "${iso}" /mnt/iso
          trap 'sudo umount /mnt/iso' EXIT
          test -f /mnt/iso/EFI/BOOT/BOOTX64.EFI || { echo "::error::ISO has no EFI bootloader"; exit 1; }
          test -d /mnt/iso/images || { echo "::error::ISO has no images/ payload"; exit 1; }
          # The boot menu must offer the choice: interactive by default, plus one
          # explicit unattended entry. Both entries use a kickstart now: the
          # interactive one only points Anaconda at the bootc payload.
          test -f /mnt/iso/interactive.ks || { echo "::error::ISO has no interactive kickstart"; exit 1; }
          grep -Fq "${{ inputs.channel_ref }}" /mnt/iso/interactive.ks \
            || { echo "::error::interactive kickstart does not track the channel ref"; exit 1; }
          grep -Fq "${{ inputs.channel_ref }}" /mnt/iso/osbuild-base.ks \
            || { echo "::error::unattended kickstart does not track the channel ref"; exit 1; }
          for menu in /mnt/iso/EFI/BOOT/grub.cfg /mnt/iso/boot/grub2/grub.cfg; do
            grep -Fq "Install Wraindrock (interactive, choose disks)" "${menu}" \
              || { echo "::error::${menu} lacks the interactive entry"; exit 1; }
            grep -Fq "Install Wraindrock - erase first disk (unattended)" "${menu}" \
              || { echo "::error::${menu} lacks the unattended entry"; exit 1; }
            [ "$(grep -cF 'inst.ks=' "${menu}")" = 2 ] \
              || { echo "::error::${menu} must have exactly two kickstart entries"; exit 1; }
            grep -Fq '/interactive.ks' "${menu}" \
              || { echo "::error::${menu} does not use the interactive kickstart"; exit 1; }
            grep -Fq '/osbuild.ks' "${menu}" \
              || { echo "::error::${menu} does not use the unattended kickstart"; exit 1; }
          done
          find /mnt/iso/EFI /mnt/iso/images -maxdepth 2 -type f | sort | head -20
          sudo umount /mnt/iso
          trap - EXIT

          ( cd output && find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -print |
              sort | sed 's|^\./||' | xargs -r -n1 sha256sum ) > output/SHA256SUMS
          cat output/SHA256SUMS
          ls -lh "${iso}" "${qcow2}"

      - name: Boot the ISO under KVM and wait for the installed system
        if: inputs.vm_test
        run: |
          set -euo pipefail
          # GitHub-hosted Linux runners expose /dev/kvm to the kvm group; the
          # workflow user is not in it, so open it up for this job only.
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          iso=$(find output/bootiso -name '*.iso' -print -quit)
          tests/vm-test.sh iso "${iso}" --timeout 3000 --out "${RUNNER_TEMP}/vm-iso"
          echo "screenshots: ${RUNNER_TEMP}/vm-iso"

      - name: Boot the qcow2 under KVM and require the Wraindrock hostname
        if: inputs.vm_test
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          qcow2=$(find output/qcow2 -name '*.qcow2' -print -quit)
          tests/vm-test.sh qcow2 "${qcow2}" --timeout 900 --out "${RUNNER_TEMP}/vm-qcow2"
          echo "screenshots: ${RUNNER_TEMP}/vm-qcow2"

      - name: Capture the interactive installer screens
        if: inputs.vm_test
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          iso=$(find output/bootiso -name '*.iso' -print -quit)
          tests/iso-interactive-shots.sh "${iso}" "${RUNNER_TEMP}/vm-interactive"

      - name: Publish disk artifacts to GHCR
        id: publish
        run: |
          set -euo pipefail
          version="${{ steps.image.outputs.version }}"
          revision="${{ steps.image.outputs.revision }}"
          digest="${{ steps.image.outputs.digest }}"
          # GHCR repository paths are lowercase; GITHUB_REPOSITORY_OWNER keeps
          # the account's casing ("Wraindrock"), which oras rejects.
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/wraindrock-linux-disk:${version}"
          iso=$(find output/bootiso -name '*.iso' -print -quit)
          qcow2=$(find output/qcow2 -name '*.qcow2' -print -quit)
          [ -n "${iso}" ] && [ -n "${qcow2}" ]

          # Hash after the VM boots, so the checksums describe the files that
          # are actually pushed (the qcow2 test boots a copy, not this file).
          ( cd output && find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -print |
              sort | sed 's|^\./||' | xargs -r -n1 sha256sum ) > output/SHA256SUMS
          cat output/SHA256SUMS

          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Immutable: one version maps to exactly one artifact set. Rerunning
          # the workflow for an already published version is a red flag, not a
          # silent overwrite.
          if oras manifest fetch "${ref}" >/dev/null 2>&1; then
            echo "::error::${ref} already exists; immutable artifact tags are never overwritten"
            exit 1
          fi

          oras push "${ref}" \
            --artifact-type application/vnd.wraindrock.disk.v1+json \
            --annotation "org.opencontainers.image.version=${version}" \
            --annotation "org.opencontainers.image.revision=${revision}" \
            --annotation "org.wraindrock.image.digest=${digest}" \
            "${qcow2}:application/vnd.wraindrock.qcow2" \
            "${iso}:application/vnd.wraindrock.iso" \
            "output/SHA256SUMS:text/plain"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          # Verify what the registry stored, not just what was uploaded.
          oras manifest fetch "${ref}" > /tmp/artifact-manifest.json
          python3 - /tmp/artifact-manifest.json "${qcow2}" "${iso}" output/SHA256SUMS <<'PY'
          import hashlib
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["artifactType"] == "application/vnd.wraindrock.disk.v1+json", manifest.get("artifactType")
          # oras records the pushed path (`output/qcow2/disk.qcow2`) as the
          # title; compare by basename.
          layers = {
              os.path.basename(layer["annotations"]["org.opencontainers.image.title"]): layer
              for layer in manifest["layers"]
          }
          assert set(layers) == {"disk.qcow2", "Wraindrock-Live.iso", "SHA256SUMS"}, layers
          sums = {}
          with open("output/SHA256SUMS", encoding="utf-8") as handle:
              for line in handle:
                  hexdigest, relpath = line.split()
                  sums[os.path.basename(relpath)] = hexdigest
          for path in sys.argv[2:]:
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              layer = layers[os.path.basename(path)]
              assert layer["digest"] == "sha256:" + digest.hexdigest(), (path, layer["digest"])
              if os.path.basename(path) != "SHA256SUMS":
                  assert sums[os.path.basename(path)] == digest.hexdigest(), (path, sums.get(os.path.basename(path)))
              assert layer["size"] == os.path.getsize(path), (path, layer["size"])
          print("artifact manifest matches the local files")
          PY

          # Anonymous fetch proves the package is public, like build.yml's
          # anonymous image pull check.
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/wraindrock-linux-disk:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${owner}/wraindrock-linux-disk/manifests/${version}")
          [ -n "${token}" ] || { echo "::error::cannot obtain an anonymous ghcr token; is the package public?"; exit 1; }
          [ "${code}" = 200 ] || { echo "::error::anonymous manifest fetch returned ${code}; is the package public?"; exit 1; }
          echo "anonymous manifest fetch: ${code}"

      - name: Upload VM evidence
        if: always() && inputs.vm_test
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-vm-evidence
          # Keep the evidence small: the 30 GiB boot disk is not evidence.
          path: |
            ${{ runner.temp }}/vm-iso/*.png
            ${{ runner.temp }}/vm-iso/serial.log
            ${{ runner.temp }}/vm-iso/qemu.log
            ${{ runner.temp }}/vm-interactive/*.png
            ${{ runner.temp }}/vm-qcow2/*.png
            ${{ runner.temp }}/vm-qcow2/serial.log
            ${{ runner.temp }}/vm-qcow2/qemu.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload qcow2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-qcow2
          path: output/qcow2
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload installer ISO + checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-iso
          path: |
            output/bootiso
            output/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        run: |
          {
            echo "## Wraindrock disk artifacts"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ inputs.image_ref }}\` |"
            echo "| Version | \`${{ steps.image.outputs.version }}\` |"
            echo "| Revision | \`${{ steps.image.outputs.revision }}\` |"
            echo "| Resolved digest | \`${{ steps.image.outputs.digest }}\` |"
            echo
            echo '```'
            cat output/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
