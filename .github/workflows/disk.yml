---
# Build installable disk artifacts (qcow2 + live ISO) from a published
# Wraindrock image. This workflow is deliberately separate from build.yml:
# the OCI image is the source of truth, and disk artifacts are derived,
# expensive, and versioned by the image they were built from.
#
# The two artifacts are built by separate jobs, in parallel, each with its
# own loopback store. A single runner had to hold the image store, BIB's
# imported copy, the ostree deployment, the live squashfs and the ISO at
# once; 60 GB and 90 GB were both exhausted. Split per job:
#   qcow2: image + BIB copy + deployment        ~50 GB
#   iso:   image + squashfs + ISO               ~35 GB
#   publish: downloaded qcow2 + ISO             ~25 GB
#
# Usage:
#   gh workflow run disk.yml -f image_ref=ghcr.io/wraindrock/wraindrock-linux:44
#
# Pin image_ref to a digest for reproducible artifacts; a moving tag is
# accepted for convenience and the resolved digest is recorded in the summary.
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Container image reference to build from (tag or digest)"
        default: "ghcr.io/wraindrock/wraindrock-linux:44"
        required: true
        type: string
      channel_ref:
        description: "Moving tag the installed system should track"
        default: "ghcr.io/wraindrock/wraindrock-linux:44"
        required: true
        type: string
      vm_test:
        description: "Boot the qcow2 and the live ISO under QEMU/KVM"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: disk
  cancel-in-progress: false

env:
  # Pinned by digest: the builder turns a bootc image into disk artifacts and
  # a floating tag would make "same commit, different ISO" possible.
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder@sha256:30e7eac70b6e4448da57aaff66d6a89dbd1526572e8b77be31da129e692eb3e9"

jobs:
  qcow2:
    name: Build qcow2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman
        run: |
          set -euo pipefail
          missing=()
          command -v podman >/dev/null || missing+=(podman)
          command -v mkfs.btrfs >/dev/null || missing+=(btrfs-progs)
          command -v qemu-img >/dev/null || missing+=(qemu-utils)
          command -v qemu-system-x86_64 >/dev/null || missing+=(qemu-system-x86)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          podman --version

      - name: Mount podman storage on a loopback btrfs
        # Only the qcow2 build runs here: image store + BIB copy + deployment.
        # 55 GB was exhausted while importing the ostree deployment; the image
        # unpacks to roughly 25 GB and BIB keeps a second copy.
        run: |
          set -euo pipefail
          img=/mnt/podman-storage.img
          if [ ! -d /mnt ]; then img=/var/tmp/podman-storage.img; fi
          sudo mkdir -p /var/lib/containers/storage
          sudo truncate -s 75G "$img"
          sudo mkfs.btrfs -f "$img"
          sudo podman system reset --force || true
          sudo systemctl stop podman.service podman.socket 2>/dev/null || true
          sudo mount -o compress=zstd:1 "$img" /var/lib/containers/storage
          sudo df -h /var/lib/containers/storage

      - name: Pull image and builder
        run: |
          set -euo pipefail
          # bootc-image-builder inspects the target image in the shared
          # containers-storage; it does not pull from the registry itself.
          for ref in "${{ inputs.image_ref }}" "${{ inputs.channel_ref }}"; do
            for attempt in 1 2 3; do
              sudo podman pull "${ref}" && break
              [ "$attempt" = 3 ] && { echo "::error::cannot pull ${ref}"; exit 1; }
              sleep $((attempt * 20))
            done
          done
          image_id=$(sudo podman image inspect --format '{{ .Id }}' "${{ inputs.image_ref }}")
          channel_id=$(sudo podman image inspect --format '{{ .Id }}' "${{ inputs.channel_ref }}")
          if [ "${image_id}" != "${channel_id}" ]; then
            echo "::error::channel tag and requested image differ; refusing to build"
            exit 1
          fi
          sudo podman pull "${BIB_IMAGE}"

      - name: Record image identity
        id: image
        run: |
          set -euo pipefail
          VERSION=$(sudo podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "${{ inputs.image_ref }}")
          REVISION=$(sudo podman image inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "${{ inputs.image_ref }}")
          DIGEST=$(sudo podman image inspect --format '{{ .Digest }}' "${{ inputs.image_ref }}")
          [ -n "${VERSION}" ] && [ -n "${REVISION}" ]
          {
            echo "version=${VERSION}"
            echo "revision=${REVISION}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${{ inputs.image_ref }}"
          echo "Version: ${VERSION}  Revision: ${REVISION}"
          echo "Digest: ${DIGEST}"

      - name: Build qcow2
        run: |
          set -euo pipefail
          mkdir -p output/qcow2
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${PWD}/output:/output" \
            -v "${PWD}/disk_config/disk.toml:/config.toml:ro" \
            "${BIB_IMAGE}" \
            build --output /output --chown "$(id -u):$(id -g)" \
            --rootfs btrfs --use-librepo=True \
            --type qcow2 "${{ inputs.channel_ref }}"
          qcow2=$(find output -type f -name '*.qcow2' | head -1)
          [ -n "${qcow2}" ] || { echo "::error::no qcow2 produced"; exit 1; }
          if [ "$(dirname "${qcow2}")" != "output/qcow2" ]; then
            mv -f "${qcow2}" output/qcow2/disk.qcow2
          fi
          ls -lh output/qcow2/disk.qcow2

      - name: Verify qcow2
        run: |
          set -euo pipefail
          qcow2=output/qcow2/disk.qcow2
          magic=$(head -c 4 "${qcow2}" | od -An -tx1 | tr -d ' \n')
          [ "${magic}" = "514649fb" ] || { echo "::error::bad qcow2 magic: ${magic}"; exit 1; }
          qemu-img info "${qcow2}"
          qemu-img check "${qcow2}"

      - name: Boot the qcow2 under KVM and require the Wraindrock hostname
        if: inputs.vm_test
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          tests/vm-test.sh qcow2 output/qcow2/disk.qcow2 --timeout 900 \
            --out "${RUNNER_TEMP}/vm-qcow2"
          echo "screenshots: ${RUNNER_TEMP}/vm-qcow2"

      - name: Checksum qcow2
        run: |
          set -euo pipefail
          ( cd output/qcow2 && sha256sum disk.qcow2 > SHA256SUMS )
          cat output/qcow2/SHA256SUMS

      - name: Upload VM evidence
        if: always() && inputs.vm_test
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-vm-qcow2
          path: |
            ${{ runner.temp }}/vm-qcow2/*.png
            ${{ runner.temp }}/vm-qcow2/serial.log
            ${{ runner.temp }}/vm-qcow2/qemu.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload qcow2
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-qcow2
          path: output/qcow2
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  iso:
    name: Build live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.image.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman and xorriso
        run: |
          set -euo pipefail
          missing=()
          command -v podman >/dev/null || missing+=(podman)
          command -v xorriso >/dev/null || missing+=(xorriso)
          command -v mkfs.btrfs >/dev/null || missing+=(btrfs-progs)
          command -v qemu-system-x86_64 >/dev/null || missing+=(qemu-system-x86)
          command -v skopeo >/dev/null || missing+=(skopeo)
          [ -f /usr/share/OVMF/OVMF_CODE.fd ] || missing+=(ovmf)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          podman --version
          xorriso --version | head -1

      - name: Mount podman storage on a loopback btrfs
        # Only the ISO build runs here: image store + squashfs + ISO.
        run: |
          set -euo pipefail
          img=/mnt/podman-storage.img
          if [ ! -d /mnt ]; then img=/var/tmp/podman-storage.img; fi
          sudo mkdir -p /var/lib/containers/storage
          sudo truncate -s 45G "$img"
          sudo mkfs.btrfs -f "$img"
          sudo podman system reset --force || true
          sudo systemctl stop podman.service podman.socket 2>/dev/null || true
          sudo mount -o compress=zstd:1 "$img" /var/lib/containers/storage
          sudo df -h /var/lib/containers/storage

      - name: Resolve image identity
        id: image
        run: |
          set -euo pipefail
          inspect=$(skopeo inspect "docker://${{ inputs.image_ref }}")
          VERSION=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["Labels"]["org.opencontainers.image.version"])' "${inspect}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ISO for ${VERSION}"

      - name: Pull image and live-ISO builder
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo podman pull "${{ inputs.channel_ref }}" && break
            [ "$attempt" = 3 ] && { echo "::error::cannot pull the image"; exit 1; }
            sleep $((attempt * 20))
          done
          # quay.io/fedora/fedora:latest intermittently returns 503 to hosted
          # runners; Docker Hub serves the same base image.
          sudo podman pull docker.io/library/fedora:latest

      - name: Build live ISO with Titanoboa
        run: |
          set -euo pipefail
          # The image carries the container-native ISO contract
          # (/usr/lib/bootc-image-builder/iso.yaml plus a dmsquash-live
          # initramfs); Titanoboa assembles it into a live ISO.
          git clone -q --filter=blob:none https://github.com/ublue-os/titanoboa.git /tmp/titanoboa
          git -C /tmp/titanoboa fetch -q --depth 1 origin 5c457c3d0518bd17e754be0fd98a60d29d26abb4
          git -C /tmp/titanoboa checkout -q FETCH_HEAD
          sed -i 's|quay.io/fedora/fedora:latest|docker.io/library/fedora:latest|g' /tmp/titanoboa/main.sh
          # The image keeps its stock initramfs for disk installs; the live
          # ISO must use the separate dmsquash-live initramfs.
          sed -i 's|initramfs\.img|initramfs-live.img|g' /tmp/titanoboa/build_iso.sh
          mkdir -p output/bootiso
          sudo env TITANOBOA_CTR_IMAGE="${{ inputs.channel_ref }}" \
            TITANOBOA_OUTPUT_DIR="${PWD}/output/bootiso" bash /tmp/titanoboa/main.sh
          iso=$(find output/bootiso -name '*.iso' -print -quit)
          [ -n "${iso}" ] || { echo "::error::no ISO produced"; exit 1; }
          if [ "$(basename "${iso}")" != "Wraindrock-Live.iso" ]; then
            mv -f "${iso}" output/bootiso/Wraindrock-Live.iso
          fi
          ls -lh output/bootiso/Wraindrock-Live.iso

      - name: Verify the live ISO
        run: |
          set -euo pipefail
          iso=output/bootiso/Wraindrock-Live.iso
          iso_size=$(stat -c %s "${iso}")
          [ "${iso_size}" -gt 1073741824 ] || { echo "::error::ISO is too small: ${iso_size}"; exit 1; }
          iso_magic=$(dd if="${iso}" bs=1 skip=32769 count=5 status=none)
          [ "${iso_magic}" = "CD001" ] || { echo "::error::not an ISO9660 image"; exit 1; }
          mbr=$(dd if="${iso}" bs=1 skip=510 count=2 status=none | od -An -tx1 | tr -d ' \n')
          [ "${mbr}" = "55aa" ] || { echo "::error::ISO is not bootable (no 0x55aa MBR)"; exit 1; }

          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "${iso}" /mnt/iso
          trap 'sudo umount /mnt/iso' EXIT
          for path in EFI/BOOT/BOOTX64.EFI EFI/fedora/grubx64.efi \
                      images/pxeboot/vmlinuz images/pxeboot/initrd.img \
                      LiveOS/squashfs.img boot/grub2/grub.cfg; do
            test -f "/mnt/iso/${path}" || { echo "::error::ISO lacks ${path}"; exit 1; }
          done
          menu=/mnt/iso/boot/grub2/grub.cfg
          grep -Fq 'Wraindrock Live' "${menu}" \
            || { echo "::error::boot menu lacks the live entry"; exit 1; }
          grep -Fq 'Wraindrock Live (Safe Graphics)' "${menu}" \
            || { echo "::error::boot menu lacks the safe-graphics entry"; exit 1; }
          grep -Fq 'Wraindrock Autoinstall' "${menu}" \
            || { echo "::error::boot menu lacks the autoinstall entry"; exit 1; }
          grep -Fq 'wraindrock.autoinstall=1' "${menu}" \
            || { echo "::error::autoinstall entry lacks the kernel flag"; exit 1; }
          grep -Fq 'wraindrock.disk=' "${menu}" \
            || { echo "::error::autoinstall entry lacks the disk parameter"; exit 1; }
          sudo umount /mnt/iso
          trap - EXIT

          ( cd output/bootiso && sha256sum Wraindrock-Live.iso > SHA256SUMS )

      - name: Boot the live ISO under KVM and require the desktop
        if: inputs.vm_test
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          tests/vm-test.sh live output/bootiso/Wraindrock-Live.iso \
            --timeout 1500 --out "${RUNNER_TEMP}/vm-live"
          echo "screenshots: ${RUNNER_TEMP}/vm-live"

      - name: Upload VM evidence
        if: always() && inputs.vm_test
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-vm-live
          path: |
            ${{ runner.temp }}/vm-live/*.png
            ${{ runner.temp }}/vm-live/serial.log
            ${{ runner.temp }}/vm-live/qemu.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload live ISO
        uses: actions/upload-artifact@v4
        with:
          name: wraindrock-${{ steps.image.outputs.version }}-iso
          path: output/bootiso
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish disk artifacts
    needs: [qcow2, iso]
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install pinned oras
        run: |
          set -euo pipefail
          version=1.3.4
          sha256=f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
          curl -fsSL -o /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz"
          echo "${sha256}  /tmp/oras.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
          oras version

      - name: Publish disk artifacts to GHCR
        id: publish
        env:
          VERSION: ${{ needs.qcow2.outputs.version }}
          REVISION: ${{ needs.qcow2.outputs.revision }}
          DIGEST: ${{ needs.qcow2.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p output/qcow2 output/bootiso
          cp "artifacts/wraindrock-${VERSION}-qcow2/disk.qcow2" output/qcow2/disk.qcow2
          cp "artifacts/wraindrock-${VERSION}-iso/Wraindrock-Live.iso" output/bootiso/Wraindrock-Live.iso
          ( cd output && find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -print |
              sort | sed 's|^\./||' | xargs -r -n1 sha256sum ) > output/SHA256SUMS
          cat output/SHA256SUMS

          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/wraindrock-linux-disk:${VERSION}"
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          if oras manifest fetch "${ref}" >/dev/null 2>&1; then
            echo "::error::${ref} already exists; immutable artifact tags are never overwritten"
            exit 1
          fi

          oras push "${ref}" \
            --artifact-type application/vnd.wraindrock.disk.v1+json \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            --annotation "org.wraindrock.image.digest=${DIGEST}" \
            "output/qcow2/disk.qcow2:application/vnd.wraindrock.qcow2" \
            "output/bootiso/Wraindrock-Live.iso:application/vnd.wraindrock.iso" \
            "output/SHA256SUMS:text/plain"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          oras manifest fetch "${ref}" > /tmp/artifact-manifest.json
          python3 - /tmp/artifact-manifest.json output/qcow2/disk.qcow2 output/bootiso/Wraindrock-Live.iso output/SHA256SUMS <<'PY'
          import hashlib
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["artifactType"] == "application/vnd.wraindrock.disk.v1+json", manifest.get("artifactType")
          layers = {
              os.path.basename(layer["annotations"]["org.opencontainers.image.title"]): layer
              for layer in manifest["layers"]
          }
          assert set(layers) == {"disk.qcow2", "Wraindrock-Live.iso", "SHA256SUMS"}, layers
          sums = {}
          with open("output/SHA256SUMS", encoding="utf-8") as handle:
              for line in handle:
                  hexdigest, relpath = line.split()
                  sums[os.path.basename(relpath)] = hexdigest
          for path in sys.argv[2:]:
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              layer = layers[os.path.basename(path)]
              assert layer["digest"] == "sha256:" + digest.hexdigest(), (path, layer["digest"])
              if os.path.basename(path) != "SHA256SUMS":
                  assert sums[os.path.basename(path)] == digest.hexdigest(), (path, sums.get(os.path.basename(path)))
              assert layer["size"] == os.path.getsize(path), (path, layer["size"])
          print("artifact manifest matches the local files")
          PY

          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/wraindrock-linux-disk:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${owner}/wraindrock-linux-disk/manifests/${VERSION}")
          [ "${code}" = 200 ] || { echo "::error::anonymous manifest fetch returned ${code}"; exit 1; }
          echo "anonymous manifest fetch: ${code}"

      - name: Summary
        run: |
          {
            echo "## Wraindrock disk artifacts"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ inputs.image_ref }}\` |"
            echo "| Version | \`${{ needs.qcow2.outputs.version }}\` |"
            echo "| Revision | \`${{ needs.qcow2.outputs.revision }}\` |"
            echo "| Resolved digest | \`${{ needs.qcow2.outputs.digest }}\` |"
            echo "| Artifact | \`${{ steps.publish.outputs.ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
