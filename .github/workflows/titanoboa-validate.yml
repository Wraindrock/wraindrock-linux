name: titanoboa-validate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE_REF: ghcr.io/wraindrock/wraindrock-linux:44
      TITANOBOA_SHA: 5c457c3d0518bd17e754be0fd98a60d29d26abb4
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Install podman and xorriso
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman xorriso
      - name: Pull the image
        run: sudo podman pull "${IMAGE_REF}"
      - name: Prepare the ISO destination
        run: |
          mkdir -p "${RUNNER_TEMP}/iso"
          : > "${RUNNER_TEMP}/iso/Wraindrock-Live.iso"
      - name: Build the ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ env.IMAGE_REF }}
          iso-dest: ${{ runner.temp }}/iso/Wraindrock-Live.iso
      - name: Verify the ISO
        run: |
          set -euxo pipefail
          iso="${{ runner.temp }}/iso/Wraindrock-Live.iso"
          ls -l "${iso}"
          xorriso -indev "${iso}" -find / -type f 2>/dev/null | grep -E '^/EFI/BOOT/(BOOTX64|grubx64|mmx64)\.efi$|^/images/pxeboot/(vmlinuz|initrd\.img)$'
          sha256sum "${iso}" | tee "${iso}.sha256"
      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: titanoboa-validate-iso
          path: ${{ runner.temp }}/iso/
          retention-days: 3
