name: titanoboa-validate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE_REF: ghcr.io/wraindrock/wraindrock-linux:44
      TITANOBOA_SHA: 5c457c3d0518bd17e754be0fd98a60d29d26abb4
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: self
      - name: Check out Titanoboa at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ublue-os/titanoboa
          ref: ${{ env.TITANOBOA_SHA }}
          path: titanoboa
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Move podman storage to the large disk
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/podman /mnt/iso
          sudo tee /etc/containers/storage.conf >/dev/null <<'CONF'
          [storage]
          driver = "overlay"
          graphroot = "/mnt/podman"
          runroot = "/run/containers/storage"
          CONF
      - name: Install podman and xorriso
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman xorriso
      - name: Pull the images
        run: |
          set -euxo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if sudo podman pull "${IMAGE_REF}" && sudo podman pull quay.io/fedora/fedora:latest; then
              ok=1
              break
            fi
            sleep 15
          done
          [[ ${ok} == 1 ]] || { echo "::error:could not pull the images"; exit 1; }
      - name: Build the ISO with Titanoboa
        id: build
        run: |
          set -euxo pipefail
          mkdir -p /mnt/iso
          iso="$(TITANOBOA_CTR_IMAGE="${IMAGE_REF}" \
                 TITANOBOA_OUTPUT_DIR="/mnt/iso" \
                 "${GITHUB_WORKSPACE}/titanoboa/main.sh")" || {
            echo "::error:Titanoboa failed"
            exit 1
          }
          [[ -f "${iso}" ]] || { echo "::error:no ISO at ${iso}"; exit 1; }
          echo "iso-dest=${iso}" >> "$GITHUB_OUTPUT"
      - name: Verify the ISO
        run: |
          set -euxo pipefail
          iso="${{ steps.build.outputs.iso-dest }}"
          ls -l "${iso}"
          xorriso -indev "${iso}" -find / -type f 2>/dev/null \
            | grep -E '^/EFI/BOOT/(BOOTX64|grubx64|mmx64)\.efi$|^/images/pxeboot/(vmlinuz|initrd\.img)$'
          sha256sum "${iso}" | tee "${iso}.sha256"
      - name: Upload the checksum
        uses: actions/upload-artifact@v4
        with:
          name: titanoboa-validate-checksum
          path: /mnt/iso/*.sha256
          retention-days: 3
